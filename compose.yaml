services:
  db:
    restart: unless-stopped
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U odoo -d postgres]
      interval: 5s
      retries: 15
  odoo:
    restart: unless-stopped
    image: odoo:18.0@sha256:c01e5bc381f087a3be2800d65cff8ad51ab0709dc54c3b81cd9b0d6c9b3a4d77
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}
    entrypoint: [/bin/bash, /opt/xyz/entrypoint.sh]
    command: [odoo, --database, "${ODOO_DB:-xyz_demo}", --db-filter, "^${ODOO_DB:-xyz_demo}$$", --without-demo=all]
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./scripts:/opt/xyz:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 12
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  db-data:
  odoo-data:
